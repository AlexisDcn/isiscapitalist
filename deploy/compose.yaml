# Stack Dockge : coller ce contenu dans une nouvelle stack "isiscapitalist"
services:
  isiscapitalist:
    image: ghcr.io/alexisdcn/isiscapitalist:latest
    container_name: isiscapitalist
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      # sauvegardes des joueurs, conservées entre les mises à jour. Volume
      # nommé : Docker le crée avec les droits de l'utilisateur du conteneur,
      # aucune commande à lancer sur le serveur.
      - userworlds:/data/userworlds
    dns:
      - 1.1.1.1
    labels:
      # Watchtower ne met à jour que les conteneurs portant ce label
      - com.centurylinklabs.watchtower.enable=true

volumes:
  userworlds:
