@if (prod(); as p) {
  <div class="produit">
    <div class="gauche">
      <div class="lesdeux icon" (click)="startFabrication()">
        <img class="objet le_premier" [src]="gameService.img(p.logo)" [alt]="p.name" />
        <div class="quantite le_second">{{ p.quantite }}</div>
      </div>
      @if (manager(); as m) {
        <img
          class="manager"
          [src]="gameService.img(m.logo)"
          [alt]="m.name"
          [title]="m.name"
        />
      }
    </div>

    <div class="droite">
      <div class="progressbar">
        <div class="fill" [class.continu]="continu()" [style.width.%]="progress()"></div>
        @if (continu()) {
          <span class="gain"><span [innerHTML]="gainParSeconde() | bigvalue"></span> / s</span>
        } @else {
          <span class="gain">+<span [innerHTML]="p.revenu * p.quantite | bigvalue"></span></span>
        }
      </div>

      <div class="achat">
        <span class="name">{{ p.name }}</span>
        <button
          mat-raised-button
          color="primary"
          [disabled]="!gameService.canBuy(p)"
          (click)="acheter()"
        >
          {{ qtmulti() }}&nbsp;: {{ gameService.numberToBuy(p) }}
          (<span [innerHTML]="gameService.coutTotal(p, gameService.numberToBuy(p)) | bigvalue"></span>)
        </button>
        <span class="temps">{{ continu() ? 'continuous' : (timeleft() | second) }}</span>
      </div>
    </div>
  </div>
}
